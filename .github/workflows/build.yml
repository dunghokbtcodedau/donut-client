name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# contents: write is needed so the job can push the built jar back to the repo.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build
        run: |
          chmod +x gradlew
          # --refresh-dependencies ignores Gradle's cached "not found" results for a failed lookup.
          # Remove it again once the build is green if you want faster runs.
          ./gradlew --no-daemon --refresh-dependencies clean test build

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: donut-client-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Pull requests (especially from forks) have a read-only token, so only branch pushes
      # and manual runs commit the jar.
      - name: Commit jar to the repository
        if: success() && github.event_name != 'pull_request'
        run: |
          # chmod +x gradlew above changes a file mode; ignore it so the tree stays clean for the rebase.
          git config core.fileMode false
          mkdir -p releases
          rm -f releases/*.jar
          for jar in build/libs/*.jar; do
            case "$jar" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            cp "$jar" releases/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A releases
          if git diff --cached --quiet; then
            echo "Jar is unchanged, nothing to commit."
            exit 0
          fi
          # [skip ci] stops this commit from starting another run.
          git commit -m "Update built jar [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
